[package]
name = "cd_to_flac"
version = "0.2.0"
edition = "2021"
description = "將 Audio CD 整片轉為無損 FLAC，可自動從 MusicBrainz 取得曲目資訊與封面"
authors = ["Grok"]
license = "MIT"

[dependencies]
eframe = "0.29"
egui = "0.29"
cd-da-reader = "1.0"
flacenc = "0.5"
rfd = "0.15"
anyhow = "1.0"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
