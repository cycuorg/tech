[package]
name = "cd_to_mp3"
version = "0.1.0"
edition = "2021"
description = "將 Audio CD 整片轉為單一 MP3 檔案的視窗程式"
authors = ["Grok"]
license = "MIT"

[dependencies]
eframe = "0.29"
egui = "0.29"
cd-da-reader = "1.0"
rusty_mp3 = "1.1"
rfd = "0.15"
anyhow = "1.0"
thiserror = "2.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
